# ============================================================
# File: pnpm-workspace.yaml
# Project: BizPilot AI
# Description: Defines the pnpm workspace, trusted native builds, package-age policy, and dependency security overrides.
# Role: Keeps dependency installation reproducible and applies reviewed transitive security patches.
# Related:
# - package.json
# - pnpm-lock.yaml
# - .github/workflows/ci.yml
# Author: MoOoH
# Created: 2026-07-22
# Last Updated: 2026-07-23
# Change Log:
# - 2026-07-23: Raised Next.js's transitive PostCSS override to a reviewed release that fixes arbitrary source-map file reads.
# ============================================================

allowBuilds:
  sharp: true
  unrs-resolver: true

# Hold newly published packages for one day by default. The exact Next.js
# 16.2.11 security-release family is temporarily exempt so the known fixes can
# ship immediately; remove these entries after the normal age window elapses.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@babel/core@7.29.6'
  - '@next/env@16.2.11'
  - '@next/eslint-plugin-next@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - 'eslint-config-next@16.2.11'
  - 'next@16.2.11'
  - 'brace-expansion@5.0.7'

overrides:
  'brace-expansion@<1.1.16': 1.1.16
  'brace-expansion@>=5 <5.0.7': 5.0.7
  '@babel/core@<=7.29.0': 7.29.6
  'js-yaml@>=4 <4.3.0': 4.3.0
  'next@16.2.11>postcss': 8.5.13
  'next@16.2.11>sharp': 0.35.3
