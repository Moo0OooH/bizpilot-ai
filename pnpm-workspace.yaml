# ============================================================
# File: pnpm-workspace.yaml
# Project: BizPilot AI
# Description: Defines the pnpm workspace, trusted native builds, package-age policy, and dependency security overrides.
# Role: Keeps dependency installation reproducible and applies reviewed transitive security patches.
# Related:
# - package.json
# - pnpm-lock.yaml
# - .github/workflows/ci.yml
# Author: MoOoH
# Created: 2026-07-22
# Last Updated: 2026-11-19
# Change Log:
# - 2026-11-19: Replaced stale 16.2.11 release exceptions and vulnerable transitive pins with patched audit-reviewed floors.
# - 2026-07-23: Raised Next.js's transitive PostCSS override to a reviewed release that fixes arbitrary source-map file reads.
# ============================================================

allowBuilds:
  sharp: true
  unrs-resolver: true

# Hold newly published packages for one day by default.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@babel/core@7.29.6'

overrides:
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=5 <5.0.12': 5.0.12
  '@babel/core@<=7.29.0': 7.29.6
  'js-yaml@>=4 <4.3.2': 4.3.2
  'postcss@>=8 <8.5.23': 8.5.23
  'nanoid@>=3 <3.3.18': 3.3.18
  'browserslist@>=4 <4.28.7': 4.28.7
  'baseline-browser-mapping@<2.11.0': 2.11.0
  'source-map-js@<1.2.2': 1.2.2
  'zod@>=4 <4.6.6': 4.6.6
  'minimatch@>=10 <11.0.1': 11.0.1
