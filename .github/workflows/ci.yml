# ============================================================
# File: .github/workflows/ci.yml
# Project: BizPilot AI
# Description: Credential-free GitHub Actions validation for the application.
# Role: Runs the same lint, typecheck, unit-test, and build gate as pnpm verify and preserves a failure log for diagnosis.
# Related:
# - package.json
# - tests/unit/ci-workflow-source.test.mts
# Author: MoOoH
# Created: 2026-05-04
# Last Updated: 2026-07-22
# Change Log:
# - 2026-07-22: Pinned CI to the security-reviewed pnpm 10.34.5 release used by the repository.
# - 2026-07-13: Restored the final read-only workflow after completing the universal V2 and full fr-CA migration.
# - 2026-07-13: Retains the complete verify log only when validation fails.
# - 2026-07-12: Isolated CI from managed Supabase and consolidated validation through pnpm verify.
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    name: App validation
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BIZPILOT_FOUNDER_EMAILS: founder@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        shell: bash
        run: |
          set +e
          pnpm verify > verify.log 2>&1
          status=$?
          cat verify.log
          exit "$status"

      - name: Upload verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-log
          path: verify.log
          if-no-files-found: error
          retention-days: 7
