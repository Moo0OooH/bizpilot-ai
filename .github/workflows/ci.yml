# ============================================================
# File: .github/workflows/ci.yml
# Project: BizPilot AI
# Description: Credential-free GitHub Actions validation for the application.
# Role: Runs the same lint, typecheck, unit-test, and build gate as pnpm verify and preserves a failure log for diagnosis.
# Related:
# - package.json
# - tests/unit/ci-workflow-source.test.mts
# Author: MoOoH
# Created: 2026-05-04
# Last Updated: 2026-07-13
# Change Log:
# - 2026-07-13: Temporarily normalizes the final duplicate V2 test import on the active PR branch.
# - 2026-07-13: Uploads the complete verify log only when validation fails.
# - 2026-07-12: Isolated CI from managed Supabase and consolidated validation through pnpm verify.
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    name: App validation
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BIZPILOT_FOUNDER_EMAILS: founder@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize final V2 verification import
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/seo-source.test.mts")
          text = path.read_text(encoding="utf-8")
          duplicate = (
              'import { getPublicV2Copy } from "../../lib/i18n/public-v2-copy.ts";\n'
              'import { getPublicV2Copy } from "../../lib/i18n/public-v2-copy.ts";\n'
          )
          single = 'import { getPublicV2Copy } from "../../lib/i18n/public-v2-copy.ts";\n'
          if duplicate in text:
              path.write_text(text.replace(duplicate, single), encoding="utf-8")
          elif text.count(single) != 1:
              raise SystemExit("Expected exactly one getPublicV2Copy import after normalization.")
          PY

      - name: Commit final V2 import normalization
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Final V2 import is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/seo-source.test.mts
          git commit -m "fix(test): remove duplicate V2 SEO import"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${branch}"

      - name: Verify
        shell: bash
        run: |
          set +e
          pnpm verify > verify.log 2>&1
          status=$?
          cat verify.log
          exit "$status"

      - name: Upload verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-log
          path: verify.log
          if-no-files-found: error
          retention-days: 7
