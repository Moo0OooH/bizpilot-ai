# ============================================================
# File: .github/workflows/ci.yml
# Project: BizPilot AI
# Description: Credential-free GitHub Actions validation for the application.
# Role: Applies the one-time final V2 activation patch on the PR branch, then runs the complete verification gate.
# Related:
# - package.json
# - tests/unit/ci-workflow-source.test.mts
# Author: MoOoH
# Created: 2026-05-04
# Last Updated: 2026-07-13
# ============================================================

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    name: App validation
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      BIZPILOT_FOUNDER_EMAILS: founder@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Activate final public V2
        if: github.event_name == 'pull_request'
        run: python scripts/activate-public-v2-final.py

      - name: Commit final public V2 activation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Final public V2 is already active."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/content-studio/page.tsx \
            app/faster-quote-replies/page.tsx \
            app/privacy/page.tsx \
            app/quote-link-guide/page.tsx \
            app/security/page.tsx \
            app/terms/page.tsx \
            components/public/marketing-ui.tsx \
            lib/i18n/public-v2-copy.ts \
            lib/i18n/public-v2-fr-copy.ts \
            lib/seo.ts
          git commit -m "feat(public): activate complete fr-CA V2 and unified navigation"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${branch}"

      - name: Verify
        shell: bash
        run: |
          set +e
          pnpm verify > verify.log 2>&1
          status=$?
          cat verify.log
          exit "$status"

      - name: Upload verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-log
          path: verify.log
          if-no-files-found: error
          retention-days: 7
