# Temporary branch-scoped autofix workflow. Delete after the patch commit lands.
name: V2 Autofix

on:
  push:
    branches:
      - agent/universal-customer-intake-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/universal-customer-intake-v2
          fetch-depth: 0

      - name: Apply exact TypeScript and source-contract fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source not found in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "components/public/bizpilot-v2-home.tsx",
              "<p>{copy.intakeLabel}</p>",
              "<p>{copy.workspace.intakeLabel}</p>",
          )
          for class_name in ("statementCard", "timelineCard", "featureCard", "finalCard"):
              replace(
                  "components/public/bizpilot-v2-home.tsx",
                  f"className={{styles.{class_name}}}",
                  f"className={{styles.{class_name} ?? \"\"}}",
              )

          replace(
              "app/pilot/page.tsx",
              "body: copy.sections[1]?.title,",
              "body: copy.sections[1]?.title ?? copy.body,",
          )
          replace(
              "app/pilot/page.tsx",
              "items: copy.sections[1]?.cards.map((card, index) => ({",
              "items: (copy.sections[1]?.cards ?? []).map((card, index) => ({",
          )

          replace(
              "components/public/bizpilot-v2-page.tsx",
              "  body?: string;\n  eyebrow?: string;",
              "  body?: string | undefined;\n  eyebrow?: string | undefined;",
          )

          replace(
              "tests/unit/public-visual-stability-source.test.mts",
              '"copy.hero.placements.map",',
              '"copy.placements.map",',
          )
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pilot/page.tsx components/public/bizpilot-v2-home.tsx components/public/bizpilot-v2-page.tsx tests/unit/public-visual-stability-source.test.mts
          git commit -m "fix(public): satisfy strict V2 type and source contracts"
          git push origin HEAD:agent/universal-customer-intake-v2
